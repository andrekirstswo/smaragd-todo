schema {
  query: BoardQueries
  mutation: BoardMutations
}

type BoardQueries {
  boards: [Board!]!
  board(boardId: String!): Board
}

type BoardMutations {
  createBoard(dto: CreateBoardDtoInput!): CreateBoardResponseDto!
}

input CreateBoardDtoInput {
  name: String!
}

type CreateBoardResponseDto {
  statusUrl: String!
}

type Board {
  boardId: String!
  name: String!
  sections: [BoardSection!]!
  accesses: [BoardUserAccess!]!
  internalId: String!
}

type BoardUserAccess {
  userId: String!
  role: String!
}

type BoardSection {
  boardSectionId: String!
  name: String!
  order: Int!
}

"The purpose of the `cost` directive is to define a `weight` for GraphQL types, fields, and arguments. Static analysis can use these weights when calculating the overall cost of a query or response."
directive @cost("The `weight` argument defines what value to add to the overall cost for every appearance, or possible appearance, of a type, field, argument, etc." weight: String!) on SCALAR | OBJECT | FIELD_DEFINITION | ARGUMENT_DEFINITION | ENUM | INPUT_FIELD_DEFINITION